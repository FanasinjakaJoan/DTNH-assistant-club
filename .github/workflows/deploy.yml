# ============================================================================
#  DTNH Assistant Club — CI/CD Web → GitHub Pages
# ============================================================================
#  - À chaque push sur `main` (touchant app/) : analyze + tests + build web,
#    puis déploiement automatique sur GitHub Pages.
#  - Sur pull_request : build + tests uniquement (pas de déploiement).
#  - Déclenchement manuel possible (workflow_dispatch).
#
#  Prérequis (une seule fois) : dépôt > Settings > Pages > Source = "GitHub Actions".
#  URL finale : https://<owner>.github.io/DTNH-assistant-club/
# ============================================================================
name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois ; on annule les builds intermédiaires.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'
  # Cible de synchronisation compilée dans l'app (surchargeable via les
  # variables de dépôt : Settings > Secrets and variables > Actions > Variables).
  DTNH_SUPABASE_SYNC_URL: >-
    ${{ vars.DTNH_SUPABASE_SYNC_URL || 'https://osjsczvsnyknkdwbciab.supabase.co/functions/v1/dtnh-sync' }}
  DTNH_SUPABASE_SECRET: ${{ secrets.DTNH_SUPABASE_SECRET }}
  DTNH_APK_URL: >-
    ${{ vars.DTNH_APK_URL || format('https://github.com/{0}/releases/latest', github.repository) }}
  DTNH_WEB_URL: >-
    ${{ vars.DTNH_WEB_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  # Authentification Google (Supabase Auth). La clé anon est publique par
  # conception (protégée par la RLS) ; le client ID Google est documentaire.
  DTNH_SUPABASE_URL: ${{ vars.DTNH_SUPABASE_URL || 'https://osjsczvsnyknkdwbciab.supabase.co' }}
  DTNH_SUPABASE_ANON_KEY: ${{ secrets.DTNH_SUPABASE_ANON_KEY }}
  DTNH_GOOGLE_CLIENT_ID: ${{ vars.DTNH_GOOGLE_CLIENT_ID }}

jobs:
  build:
    name: Analyze, test & build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versions
        run: flutter --version

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        # `--no-fatal-infos --no-fatal-warnings` : seules les *erreurs* bloquent
        # la CI. Les diagnostics sont aussi republiés en annotations : ils
        # restent lisibles dans l'onglet Checks sans ouvrir le journal du job.
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1
          status=$?
          awk '/^[[:space:]]*error[[:space:]]/ {print}' /tmp/analyze.txt | head -25 |
            while IFS= read -r line; do echo "::error::$line"; done
          tail -5 /tmp/analyze.txt
          exit $status

      - name: Tests
        run: flutter test

      - name: Build web (base-href GitHub Pages)
        # Les --dart-define sont lus par lib/core/config/app_config.dart.
        # Le secret n'est requis que pour pousser des données : le build reste
        # fonctionnel s'il est absent (valeur vide => compilation réussie,
        # synchronisation à configurer dans les réglages de l'app).
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --pwa-strategy=offline-first
          --dart-define=DTNH_SUPABASE_SYNC_URL="$DTNH_SUPABASE_SYNC_URL"
          --dart-define=DTNH_SUPABASE_SECRET="$DTNH_SUPABASE_SECRET"
          --dart-define=DTNH_APK_URL="$DTNH_APK_URL"
          --dart-define=DTNH_WEB_URL="$DTNH_WEB_URL"
          --dart-define=DTNH_SUPABASE_URL="$DTNH_SUPABASE_URL"
          --dart-define=DTNH_SUPABASE_ANON_KEY="$DTNH_SUPABASE_ANON_KEY"
          --dart-define=DTNH_GOOGLE_CLIENT_ID="$DTNH_GOOGLE_CLIENT_ID"

      - name: Vérifier l'activation de GitHub Pages
        # GitHub Pages doit être activé une seule fois par un administrateur :
        # Settings > Pages > Source = « GitHub Actions ». Sans cela,
        # `configure-pages` échoue en 404 et fait tomber tout le workflow.
        # On détecte ce cas pour continuer (les tests + build web restent
        # validés, l'app est de toute façon servie par Vercel) au lieu de
        # produire un échec trompeur.
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages activé : le site sera publié."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages n'est pas activé (Settings > Pages > Source = GitHub Actions). Déploiement Pages ignoré ; l'application reste publiée par Vercel."
          fi

      - name: Configurer Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Uploader l'artefact Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    # On ne déploie que sur push vers main (pas sur les PR), et uniquement si
    # GitHub Pages est activé sur le dépôt (sinon Vercel assure la publication).
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
