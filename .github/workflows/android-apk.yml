# ============================================================================
#  DTNH Assistant Club — Build APK Android (distribution interne)
# ============================================================================
#  - push sur `main` : APK debug (installable immédiatement).
#  - tag `v*`        : APK release + attaché à la GitHub Release.
#  - manuel          : choix du mode (debug / release / split-par-ABI).
#
#  L'APK release est signé avec la clé debug (android/app/build.gradle.kts) :
#  installable par le staff sans keystore. Pour le Play Store, ajouter une vraie
#  signingConfig via des secrets (voir docs/05-DEVOPS.md).
#
#  Récupérer l'APK : onglet Actions > run > Artifacts "dtnh-assistant-apk".
# ============================================================================
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Mode de build'
        type: choice
        options: [debug, release, split]
        default: debug

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  apk:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Build APK
        run: |
          MODE="${{ github.event.inputs.build_mode || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }}"
          echo "Mode de build : $MODE"
          case "$MODE" in
            release) flutter build apk --release ;;
            split)   flutter build apk --release --split-per-abi ;;
            *)       flutter build apk --debug ;;
          esac

      - name: Rassembler les APK
        run: |
          mkdir -p ../dist
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[ ]*//; s/+.*//')
          for apk in build/app/outputs/flutter-apk/*.apk; do
            cp "$apk" "../dist/dtnh-assistant-v${VERSION}-$(basename "$apk")"
          done
          ls -lh ../dist

      - name: Uploader l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: dtnh-assistant-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attacher à la GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
