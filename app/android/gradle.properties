# Mémoire volontairement bornée : la valeur du modèle Flutter (-Xmx8G) dépasse
# la RAM des runners GitHub Actions et des petites machines de dev, ce qui fait
# échouer la JVM au démarrage (« Could not reserve enough space for object heap »).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
